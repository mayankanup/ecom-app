name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  order-concurrency-check:
    name: Order concurrency correctness test
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start payment-service in the background
        working-directory: payment-service
        run: |
          nohup ./mvnw -q spring-boot:run > payment-service.log 2>&1 &
          echo "Waiting for payment-service to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/api/health > /dev/null; then
              echo "payment-service is up."
              exit 0
            fi
            sleep 2
          done
          echo "payment-service did not become ready in time."
          cat payment-service.log
          exit 1

      - name: Start backend in the background
        working-directory: backend
        run: |
          nohup ./mvnw -q spring-boot:run > backend.log 2>&1 &
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time."
          cat backend.log
          exit 1

      - name: Run concurrent order stock race simulation
        working-directory: perf-tests
        run: ./mvnw -B gatling:test -Dgatling.simulationClass=com.ecom.app.perf.ConcurrentOrderStockRaceSimulation

      - name: Show service logs
        if: always()
        run: |
          echo "--- backend.log ---"
          cat backend/backend.log || true
          echo "--- payment-service.log ---"
          cat payment-service/payment-service.log || true

  payment-contract:
    name: Pact contract (backend <-> payment-service)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate the consumer contract
        working-directory: backend
        run: ./mvnw -B test -Dtest=PaymentClientPactTest

      - name: Verify it against the real provider
        working-directory: payment-service
        run: ./mvnw -B test

  karate-tests:
    name: Karate API tests (order placement)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start payment-service in the background
        working-directory: payment-service
        run: |
          nohup ./mvnw -q spring-boot:run > payment-service.log 2>&1 &
          echo "Waiting for payment-service to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/api/health > /dev/null; then
              echo "payment-service is up."
              exit 0
            fi
            sleep 2
          done
          echo "payment-service did not become ready in time."
          cat payment-service.log
          exit 1

      - name: Start backend in the background
        working-directory: backend
        run: |
          nohup ./mvnw -q spring-boot:run > backend.log 2>&1 &
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time."
          cat backend.log
          exit 1

      - name: Run Karate order-placement tests
        working-directory: karate-tests
        run: ./mvnw -B test

      - name: Show service logs
        if: always()
        run: |
          echo "--- backend.log ---"
          cat backend/backend.log || true
          echo "--- payment-service.log ---"
          cat payment-service/payment-service.log || true
